#-----------------------------------------------------------------------------
# Radiometer Processor Parameters
# Number_of_targets - Number of targets for cruise or tour sequence
# target_1 - Extra target in addition to main target set by target_keyword
# cold_sky_Temperature - cold sky temperature
# cold_sky_average_time - cold sky calibration time duration
# target_temperature - target temperature 
# norm_rl_count : expected RL count when Trlotmp=300 K, 262000 
# radiometer_cal_gain : radiometer calibrated gain using Saturn, 206.2 1/(K s)
# receiver_temperature : 550 K
# min_beam_distance - Distance between limb direction and boresight in units of beam oneway 3dB
# cold_sky_cal_polynomial_fit_order : nth polynomial fitting
# maximum_separation_bet_cold_sky_meas : time between cold sky calibration
# radiometer_delta_tau - Parameter for performed radiometer normalization 0 s
# radiometer_offset - Parameter for performed radiometer normalization 3550
# noise_diode_delta_tau - noise diode integration time offset
# resistive_load_delta_tau - resistive load integration time offset
# ND_Rip - Noise Diode Radiometric integration time (used in RMSS)
# Max_ND_Rip - Maximum Noise Diode Radiometric integration time when auto rad is on
# RL_Rip - Resistive Load Radiometric integration time (used in RMSS)
# Max_RL_Rip - Maximum Resistive Load Radiometric integration time when auto rad is on
#-----------------------------------------------------------------------------

cold_sky_Temperature 2.738 K
cold_sky_average_time 30 s
target_temperature 91 K
norm_rl_count 262000 1/s
radiometer_cal_gain 206.2 1/(K s)
receiver_temperature 550 K
min_beam_distance 2.5 
cold_sky_cal_polynomial_fit_order 1
maximum_separation_bet_cold_sky_meas 5 min
radiometer_delta_tau -1.175 ms
radiometer_offset 3550
noise_diode_delta_tau -0.12 ms
resistive_load_delta_tau -0.0405 ms
ND_Rip 5 ms
Max_ND_Rip 8 ms
RL_Rip 25 ms
Max_RL_Rip 40 ms

