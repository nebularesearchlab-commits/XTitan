#-----------------------------------------------------------------------------
# Parameters to be used by amb_param_scan
# pulse_bandwidth_ratio
# usable_area_search_max_prf - Set maximum prf 
# usable_area_search_min_prf - Set minimum prf 
# usable_area_number_of_prf_steps - Used by amb_param_scan, search usable area
# 	 			using prf values from min_prf to max_prf 
# 				at an interval of 
# 			       (max_prf - min_prf)/number_of_prf_steps 
# usable_area_search_max_pulsegate - Set maximum pulsegate 
# usable_area_search_min_pulsegate - Set minimum pulsegate 
# usable_area_number_of_pulsegate_steps - Used by amb_param_scan, search usable 
# 				area using pulsegate values
# 				from min_pulsegate to max_pulsegate 
# 				at an interval of 
#                      (max_pulsegate - min_pulsegate)/number_of_pulsegate_steps 
#-----------------------------------------------------------------------------

pulse_bandwidth_ratio 0.8
usable_area_search_max_prf 6.0 KHz
usable_area_search_min_prf 2.0 KHz
usable_area_number_of_prf_steps 41
usable_area_search_max_pulsegate  50 km
usable_area_search_min_pulsegate  20 km
usable_area_number_of_pulsegate_steps 6

#-----------------------------------------------------------------------------
#  Requirements for a pixel to be "usable" 
# signal_to_amb_ratiodB - Usable area should have a signal to amb ratio > + 14 dB
# noise_equivalent_sigma0dB - Usable area should have a sigma0 < - 10 dB
# min_oneway_gaindB_wrt_peak - Usable area should have a gain > -5 dB
#-----------------------------------------------------------------------------

signal_to_amb_ratiodB 14
noise_equivalent_sigma0dB -10
min_oneway_gaindB_wrt_peak -5

