# carrier_frequency - Ku band frequency (13.78 GHz)
# stalo_frequency - stable local oscillator frequency (10 MHz)
#-----------------------------------------------------------------------------

Pt    46.2 W
Tsys  800 K
dutycycle_per_burst 0.069
constant_dutycycle_value 0.7
carrier_frequency 13.78 GHz

