#-----------------------------------------------------------------------------
# dutycyle and altitude values
# dutycycle_profile_option - Specifies the form of the dutycycle profile 
#   to be used
# Valid values for: dutycycle_profile_option
# constant_dutycycle - Use constant dutycycle value in radar parameter block
# polynomial_fit - Use a polymonial profile in the least squares sense
# 	         to points listed in this config file
#                  It is very unlikely that we are going to use this option
#-----------------------------------------------------------------------------

dutycycle_profile_option constant_dutycycle 

#-----------------------------------------------------------------------------
# Altitude-dependent dutycycle setup 
#   when dutycycle profile option is polynomial_fit
# alt_dutycycle_polynomial_power - the order of polynomial used to fit the 
# 	                      dutycycle profile points
# number_of_altitude_dutycycle_variations - number of points to fit to
#  			                  to a polynomial profile
# alt_dutycycle1 - altitude point to fit a polynomial profile
# dutycycle1      - dutycycle point to fit a polynomial profile
# alt_dutycycle2 - altitude point to fit a polynomial profile
# dutycycle2      - dutycycle point to fit a polynomial profile
# alt_dutycycle3 - altitude point to fit a polynomial profile
# dutycycle3      - dutycycle point to fit a polynomial profile
# alt_dutycycle4 - altitude point to fit a polynomial profile
# dutycycle4      - dutycycle point to fit a polynomial profile
# alt_dutycycle5 - altitude point to fit a polynomial profile
# dutycycle5      - dutycycle point to fit a polynomial profile
#-----------------------------------------------------------------------------

alt_dutycycle_polynomial_power 2 
number_of_altitude_dutycycle_variations 3 
alt_dutycycle1 1000 km
dutycycle1 0.6
alt_dutycycle2 2000 km
dutycycle2 0.65
alt_dutycycle3 4000 km
dutycycle3 0.70

#-----------------------------------------------------------------------------
# Parameters needed to set attenuator for scatterometer(ALTL) mode
# cal_gaindB_altl - gain setting when calibration was performed
# cal_radar_buffer_std_deviation_altl - standard deviation of radar buffer output (8-8 bits)
# squared_deviation_of_system_noise_input_at_ALTL - measured squared deviation of 8-8 straight radar buffer data with the system noise and ALTL bandwidth
# squared_deviation_of_system_noise_input_at_ALTH - measured squared deviation of 8-8 straight radar buffer data with the system noise and ALTH bandwidth
# squared_deviation_of_system_noise_input_at_SARL - measured squared deviation of 8-8 straight radar buffer data with the system noise and SARL bandwidth
# squared_deviation_of_system_noise_input_at_SARH - measured squared deviation of 8-8 straight radar buffer data with the system noise and SARH bandwidth
#-----------------------------------------------------------------------------

cal_gaindB_altl  8 
cal_radar_buffer_std_deviation_altl  20.3
squared_deviation_of_system_noise_input_at_ALTL 1.7e18 s/J 
squared_deviation_of_system_noise_input_at_ALTH 1.7e18 s/J 
squared_deviation_of_system_noise_input_at_SARL 1.7e18 s/J 
squared_deviation_of_system_noise_input_at_SARH 1.7e18 s/J 

