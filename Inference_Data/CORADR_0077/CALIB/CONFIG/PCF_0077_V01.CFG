#-----------------------------------------------------------------------------
# When incidence angle Incidence angle sech profile parameters
# when angle_profile_option is sech_function
# angle = angle1 + 2*(angle2-angle1)/{exp( (x-x0)/a) + exp(-(x-x0)/a)}
#  angle1: residual incidence angle at high altitude
#  angle2: desired incidence angel at closest approach
#  a: this parameter will be calculated inside dlap_generate programs
#     and is used to obtain a desired incidence angle
#     at a mid altitude between closest approach (about 950 km) and
#     high altitude (> 4000 km)
#  this function will try to fit incidence angle at CA, residual incidence angle
#  at high altitude,and one mid point value between CA and high altitude
# incidence_angle_at_lowest_altitude - for sech_function model
# mid_altitude - for sech_function model
# incidence_angle_at_mid_altitude - for sech_function_model
# residual_incidence_angle_at_high_altitude - for sech_function model 
#-----------------------------------------------------------------------------

incidence_angle_at_lowest_altitude 35 deg
mid_altitude 2000 km
incidence_angle_at_mid_altitude 20 deg
residual_incidence_angle_at_high_altitude  0 deg

