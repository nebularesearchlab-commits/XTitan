# beam_azi_2 - Beam 2 azimuth beamwidth
# beam_azi_3 - Beam 3 azimuth beamwidth
# beam_azi_4 - Beam 4 azimuth beamwidth
# beam_azi_5 - Beam 5 azimuth beamwidth
# beam_elev_1 - Beam 1 elevation beamwidth
# beam_elev_2 - Beam 2 elevation beamwidth
# beam_elev_3 - Beam 3 elevation beamwidth
# beam_elev_4 - Beam 4 elevation beamwidth
# beam_elev_5 - Beam 5 elevation beamwidth
# beam_maxdB_gain1 - Beam 1 maximum gain (dB)
# beam_maxdB_gain2 - Beam 2 maximum gain (dB)
# beam_maxdB_gain3 - Beam 3 maximum gain (dB)
# beam_maxdB_gain4 - Beam 4 maximum gain (dB)
# beam_maxdB_gain5 - Beam 5 maximum gain (dB)
# beam_mindB_gain - Beam gain value reported for out of range angles
# beam_pattern_directory - full path to the directory containing beam patterns
# beam_1_pattern_file - name of file containing pattern data for beam 1
# beam_2_pattern_file - name of file containing pattern data for beam 2
# beam_3_pattern_file - name of file containing pattern data for beam 3
