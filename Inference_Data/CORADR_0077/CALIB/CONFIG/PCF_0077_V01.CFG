#-----------------------------------------------------------------------------
# Epoch Setup
# epoch_selection - specifies how the epoch time for this config file is set
# Valid values for: epoch_selection
#   absolute - The value specified by epoch_time is used directly
#   closest_flyby - The closest approach time nearest to epoch_time is used
# epoch_accuracy - The precision of the search for the closest flyby time
# epoch_time - The epoch time to use, or the starting point in the search for
#              the epoch time to use.
#-----------------------------------------------------------------------------

epoch_selection absolute
epoch_accuracy 1 ms
epoch_time 2006-073T11:30:00.000

#-----------------------------------------------------------------------------
# SAR Pointing and IVD Setup
# look_direction - Specifies which side to tilt the 5 beams towards
# Valid values for: look_direction
#   right - Look to the right when you look along the velocity direction from
#           behind the spacecraft.
#   left - Look to the left when you look along the velocity direction from
#          behind the spacecraft.
# sc_orientation - Specifies whether plus or minus X should be closest to the
#                  velocity direction during the IVD interval.
#                  ie., resolve the 180 degree ambiguitiy in SAR pointing.
# Valid values for: sc_orientation
#   -x_direction_to_velocity - Hold -X towards the velocity direction
#   +x_direction_to_velocity - Hold +X towards the velocity direction
# ivd_file - the name of the output IVD file to create
# start_time_ivd - Start time of SAR profile - used to create ivd files
# time_step_ivd - used to create ivd files
# end_time_ivd - End time of SAR profile - used to create ivd files
# ivd_time_pad - amount of time to add to the IVD time interval on each side.
#                This creates an IVD file valid for a longer time interval.
# ivd_fractional_second  - determine fractional time in generating IVD
#-----------------------------------------------------------------------------

look_direction right
sc_orientation  -x_direction_to_velocity
ivd_file RADAR_S14_SOPU_T7_050523.ivd
start_time_ivd -25 min
time_step_ivd 1 s
end_time_ivd 25  min
ivd_time_pad 7 min

