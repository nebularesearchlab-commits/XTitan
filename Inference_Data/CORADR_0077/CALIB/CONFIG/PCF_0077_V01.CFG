# L1B_A_filename - Active mode file name(Scatterometry,Altimetry or SAR)
# L1B_P_filename - Passive mode file name(Radiometer)
# ras_filename - compressed BAQ threshold and RAW data
# burst_ordered_ieblist - bursted ordered ieblist filename
# L1I_filename - SAR Processor burst-by-burst output file
# t_feed_filename - Filename for external temperature telemetry 
# 		  E-2507.gph  or NONE if not available
# t_hga_filename  - Filename for external temperature telemetry 
# 		  E-2505.gph  or NONE if not available
# t_scwg_filename - Filename for external temperature telemetry 
# 		  E-2503.gph  or NONE if not available
# Adjust_TFI_in_units_of_sclk - change TFI (active mode nominal value 1)
# zero_range_time_delay - positive delay in generating pulse after
